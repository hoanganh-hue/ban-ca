version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: underwater_game
      POSTGRES_USER: gameuser
      POSTGRES_PASSWORD: gamepassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameuser -d underwater_game"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for scaling (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Game Server
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://gameuser:gamepassword@postgres:5432/underwater_game?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-for-development
      - CORS_ORIGIN=http://localhost:3000
      - PORT=8080
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server/src:/app/server/src
      - ./server/prisma:/app/server/prisma
      - ./shared:/app/shared
      - /app/server/node_modules
    command: sh -c "cd server && ./node_modules/.bin/prisma generate && ./node_modules/.bin/prisma db push && npm run dev"
    restart: unless-stopped

  # Client Development Server
  client:
    build:
      context: .
      dockerfile: client/Dockerfile.dev
    environment:
      - NODE_ENV=development
      - REACT_APP_SERVER_URL=ws://localhost:8081
      - REACT_APP_API_URL=http://localhost:8081/api
    ports:
      - "3000:3000"
    volumes:
      - ./client/src:/app/client/src
      - ./client/public:/app/client/public
      - ./shared:/app/shared
      - ./assets:/app/client/public/assets
      - /app/client/node_modules
    command: npm --prefix client run dev
    depends_on:
      - server
    restart: unless-stopped

  # Nginx for production (optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./client/dist:/var/www/html
    depends_on:
      - server
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: underwater-game-network
