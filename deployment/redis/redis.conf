# Redis Configuration for Underwater Fishing Game
# Optimized for production use

# Network and connection settings
bind 0.0.0.0
port 6379
tcp-backlog 511
tcp-keepalive 300

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence settings
save 900 1
save 300 10
save 60 10000

# Enable AOF for better durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Security
# requirepass will be set via environment variable

# Logging
loglevel notice
logfile ""
syslog-enabled no

# Performance optimizations
timeout 0
keepalive 300

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 100

# Memory usage optimizations
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog
hll-sparse-max-bytes 3000

# Streams
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Client query buffer limit
client-query-buffer-limit 1gb

# Protocol max bulk length
proto-max-bulk-len 512mb

# Hz frequency
hz 10

# Dynamic HZ
dynamic-hz yes

# AOF load truncated
aof-load-truncated yes

# RDB save compressed
rdbcompression yes
rdbchecksum yes

# Stop writes on BG save error
stop-writes-on-bgsave-error yes

# Replica settings (if using Redis replication)
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-ping-replica-period 10
repl-timeout 60
repl-disable-tcp-nodelay no
replica-priority 100

# Security settings
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG "CONFIG_c0f6e7d9a1b2e8f4"

# Lua settings
lua-time-limit 5000

# Cluster settings (disable for single instance)
cluster-enabled no

# Slow log settings for game monitoring
notify-keyspace-events "Ex"

# Maxclients
maxclients 1000

# Database count
databases 1
